<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>BiblioTech</title>

    <link
        rel="manifest"
        href="manifest.json">

    <meta
        name="theme-color"
        content="#00aaff">

    <meta
        name="mobile-web-app-capable"
        content="yes">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Google Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Sekuya&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="main.css">


</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-9 col-md-7 col-lg-5">

                <div class="login-box mx-auto">
                    
        <img src="imagens/livro_2.png" alt="livro" class="logo">

        <h1 class="sekuya-regular">BiblioTech</h1>


                    <form onsubmit="login(event)">

                        <div class="mb-3">
                            <label for="name" class="form-label">NAME</label>
                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                placeholder="Digite seu nome">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">EMAIL</label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                placeholder="hello@email.com">
                        </div>

                        <div class="mb-4">
                            <label for="senha" class="form-label">PASSWORD</label>
                            <input
                                type="password"
                                class="form-control"
                                id="senha"
                                placeholder="******">
                        </div>

                        <button type="submit" class="btn btn-outline-light w-100 btn-custom" >
                            Sign up
                        </button>
                        <p id="mensagem" class="text-center mt-3"></p>
                    </form>
                    <footer>

                    © 2026 Bibliotech

                    </footer>
                </div>

            </div>
        </div>
    </div>
    <script>

    if ("serviceWorker" in navigator) {

        window.addEventListener("load", () => {

            navigator.serviceWorker
                .register("./service-worker.js")
                .then(registration => {

                    console.log(
                        "Service Worker registrado:",
                        registration.scope
                    );

                })
                .catch(error => {

                    console.error(
                        "Erro ao registrar Service Worker:",
                        error
                    );

                });

        });

    }

</script>
<script src="script.js"></script>
</body>
</html>
